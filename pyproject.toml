[project]
name = "my-agent"
version = "0.1.0"
description = "Minimal Agentic RAG starter using FastAPI, LangChain, RAGFlow-ready retrieval, and LangSmith tracing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "requests>=2.32.0",
    "pypdf>=5.4.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.37",
    "langchain-google-genai>=3.1.0",
    "langchain-openai>=0.1.22",
    "langgraph>=0.2.31",
    "langsmith>=0.1.147",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
